apiVersion: v1
kind: Secret
metadata:
  name: abir-local-tls
  namespace: rbac-dashboard
type: kubernetes.io/tls
data:
  # Generated cert covering: argocd.abir.local, dashboard.abir.local, app.abir.local
  # Base64 values injected by GitHub Actions from repo secret INGRESS_TLS_CERT / INGRESS_TLS_KEY
  # For manual setup, run:
  #   kubectl create secret tls abir-local-tls \
  #     --cert=k8s/abir-local-tls.crt \
  #     --key=/tmp/ingress-certs/tls.key \
  #     -n rbac-dashboard
  tls.crt: PLACEHOLDER_CERT
  tls.key: PLACEHOLDER_KEY
