name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./Backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/kuberbac-backend:latest

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./Frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/kuberbac-frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Trigger ArgoCD Sync
      run: |
        echo "ArgoCD will automatically detect changes in the k8s/ directory if configured with Auto-Sync."
        echo "If you need a manual trigger via API, you can add it here."
