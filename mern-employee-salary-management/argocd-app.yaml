apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kuberbac-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abir-287/kuberbac-dashboard.git
    targetRevision: HEAD
    path: mern-employee-salary-management/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
