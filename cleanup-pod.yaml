apiVersion: v1
kind: Pod
metadata:
  name: host-cleanup
  namespace: kube-system
spec:
  nodeSelector:
    kubernetes.io/hostname: worker1
  tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: NoExecute
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule
  hostPID: true
  hostNetwork: true
  containers:
  - name: cleanup
    image: alpine:latest
    securityContext:
      privileged: true
    command: ["nsenter", "--target", "1", "--mount", "--uts", "--ipc", "--net", "--pid", "--", "sh", "-c", "df -h && crictl rmi --prune || true && journalctl --vacuum-time=1d || true && df -h"]
