# Pipeline Version: 2.1 - Resilient GitOps Loop
name: Build → Push → Deploy

on:
  push:
    branches: [main]
    paths:
      - 'kuberbac-dashboard/Backend/**'
      - 'kuberbac-dashboard/Frontend/**'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/abir-287/kuberbac-backend
  FRONTEND_IMAGE: ghcr.io/abir-287/kuberbac-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push updated manifests
      packages: write      # push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Needed for rebase

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./kuberbac-dashboard/Backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./kuberbac-dashboard/Frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=https://app.abir.local/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Update image tags in manifests ───────────────────────────────────────
      - name: Update image tags in K8s manifests
        run: |
          sed -i "s|image: .*kuberbac-backend.*|image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}|" \
            apps/dev/backend/deployment.yaml
          sed -i "s|image: .*kuberbac-frontend.*|image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|" \
            apps/dev/frontend/deployment.yaml

      # ── Inject TLS secret into tls-secret.yaml ───────────────────────────────
      - name: Inject TLS cert into manifest
        run: |
          TLS_CRT=$(echo "${{ secrets.INGRESS_TLS_CERT }}" | base64 -w0)
          TLS_KEY=$(echo "${{ secrets.INGRESS_TLS_KEY }}" | base64 -w0)
          sed -i "s|PLACEHOLDER_CERT|${TLS_CRT}|" apps/dev/tls-secret.yaml
          sed -i "s|PLACEHOLDER_KEY|${TLS_KEY}|" apps/dev/tls-secret.yaml

      - name: Commit and Push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Use a loop to handle potential push rejections/conflicts
          for i in {1..5}; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            
            # Re-apply the changes to the fresh state
            sed -i "s|image: .*|image: abir287/kuberbac-backend:${{ github.sha }}|g" apps/dev/backend/deployment.yaml
            sed -i "s|image: .*|image: abir287/kuberbac-frontend:${{ github.sha }}|g" apps/dev/frontend/deployment.yaml
            
            git add apps/dev/backend/deployment.yaml apps/dev/frontend/deployment.yaml
            
            # Only commit if there are changes
            if git diff-index --quiet HEAD; then
              echo "No changes to commit"
              exit 0
            fi
            
            git commit -m "ci: deploy images ${{ github.sha }} [attempt $i]"
            
            if git push origin main; then
              echo "Successfully pushed updated manifests"
              exit 0
            fi
            
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          done
          
          echo "Failed to push after 5 attempts"
          exit 1
