name: Build → Push → Deploy

on:
  push:
    branches: [main]
    paths:
      - 'kuberbac-dashboard/Backend/**'
      - 'kuberbac-dashboard/Frontend/**'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/abir-287/kuberbac-backend
  FRONTEND_IMAGE: ghcr.io/abir-287/kuberbac-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push updated manifests
      packages: write      # push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./kuberbac-dashboard/Backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./kuberbac-dashboard/Frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=https://app.abir.local/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Update image tags in manifests ───────────────────────────────────────
      - name: Update image tags in K8s manifests
        run: |
          sed -i "s|image: .*kuberbac-backend.*|image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}|" \
            apps/dev/backend/deployment.yaml
          sed -i "s|image: .*kuberbac-frontend.*|image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|" \
            apps/dev/frontend/deployment.yaml

      # ── Inject TLS secret into tls-secret.yaml ───────────────────────────────
      - name: Inject TLS cert into manifest
        run: |
          TLS_CRT=$(echo "${{ secrets.INGRESS_TLS_CERT }}" | base64 -w0)
          TLS_KEY=$(echo "${{ secrets.INGRESS_TLS_KEY }}" | base64 -w0)
          sed -i "s|PLACEHOLDER_CERT|${TLS_CRT}|" apps/dev/tls-secret.yaml
          sed -i "s|PLACEHOLDER_KEY|${TLS_KEY}|" apps/dev/tls-secret.yaml

      # ── Commit updated manifests → ArgoCD picks them up ─────────────────────
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/dev/backend/deployment.yaml apps/dev/frontend/deployment.yaml apps/dev/tls-secret.yaml
          git diff --staged --quiet && echo "No manifest changes" || \
            git commit -m "ci: deploy images ${{ github.sha }}" && git push
